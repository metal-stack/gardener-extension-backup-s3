{{- if .Values.networkPolicies.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-s3
  namespace: {{ .Release.Namespace }}
spec:
  egress:
  - to:
    - podSelector:
        matchLabels:
          {{- .Values.networkPolicies.ingressController.podSelector | toYaml | nindent 10 }}
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicies.ingressController.namespace }}
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "name" . }}
  policyTypes:
  - Egress

{{- if (include "runtimeCluster.enabled" .) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-s3
  namespace: garden
spec:
  egress:
  - to:
    - podSelector:
        matchLabels:
          {{- .Values.networkPolicies.ingressController.podSelector | toYaml | nindent 10 }}
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicies.ingressController.namespace }}
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "name" . }}
  policyTypes:
  - Egress

{{- end }}

{{- end }}
